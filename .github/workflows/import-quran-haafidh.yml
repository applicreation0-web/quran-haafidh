name: One-time import Quran Haafidh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Import exact Quran Hifz release source into isolated repository
        shell: bash
        env:
          SOURCE_SHA: dcaa84ea672101c3403e63cee1e889f44f7dadb5
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/applicreation0-web/quran-hafidh/archive/${SOURCE_SHA}.tar.gz" \
            -o "$tmp/source.tar.gz"
          tar -xzf "$tmp/source.tar.gz" -C "$tmp"
          src="$tmp/quran-hafidh-${SOURCE_SHA}"
          test -d "$src"

          # Replace the bootstrap repository contents while preserving only .git.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Copy application source, but deliberately omit inherited Actions workflows
          # so this isolated copy does not start Claude's CI/release automation or consume Actions quota.
          rsync -a --exclude='.github/workflows/' "$src/" ./
          rm -rf .github/workflows

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('hifz-app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android:label="Quran Hifz"' not in text:
              raise SystemExit('Expected Quran Hifz application label not found')
          manifest.write_text(text.replace('android:label="Quran Hifz"', 'android:label="Quran Haafidh"'), encoding='utf-8')

          gradle = Path('hifz-app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          if 'applicationId = "com.quransafeguard.hifz"' not in text:
              raise SystemExit('Expected applicationId not found')
          gradle.write_text(text.replace('applicationId = "com.quransafeguard.hifz"', 'applicationId = "com.quranhaafidh.app"'), encoding='utf-8')

          settings = Path('settings.gradle.kts')
          text = settings.read_text(encoding='utf-8')
          if 'rootProject.name = "QuranSafeguard"' not in text:
              raise SystemExit('Expected Gradle root project name not found')
          settings.write_text(text.replace('rootProject.name = "QuranSafeguard"', 'rootProject.name = "Quran Haafidh"'), encoding='utf-8')

          # Rename other user-visible occurrences without touching identifiers such as
          # Quran-Hifz-Husary-Muallim.zip or package/source namespaces.
          for path in Path('hifz-app/src/main').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  s = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'Quran Hifz' in s:
                  path.write_text(s.replace('Quran Hifz', 'Quran Haafidh'), encoding='utf-8')
          PY

          cat > QURAN_HAAFIDH_ORIGIN.md <<'EOF'
          # Quran Haafidh — isolated source copy

          This repository was copied from `applicreation0-web/quran-hafidh` at the exact source commit used by the displayed 0.7.13-boox release:

          `dcaa84ea672101c3403e63cee1e889f44f7dadb5`

          Isolation changes made during import:
          - visible Android application name: `Quran Haafidh`;
          - Gradle root project name: `Quran Haafidh`;
          - Android application ID: `com.quranhaafidh.app`, so test installs can coexist with the original Quran Hifz package;
          - inherited GitHub Actions workflows intentionally omitted to avoid affecting the source/Claude workflow or consuming CI quota.

          The source repository and Claude branch were not modified by this import.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import isolated Quran Haafidh source from dcaa84ea"
          git push origin HEAD:main
